<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Deadline Collapse: Ship It</title>
        <link rel="stylesheet" href="style.css"> 
    </head>
    <body>
        <header id="top-bar">
            <span id="company-name">Deadline Collapse</span>
            <div class="stat">WEEK <span id="week">1</span></div>
            <div class="stat">MONEY <span id="money">$10,000</span></div>
            <div class="stat">REPUTATION <span id="reputation">100</span></div>
            <div class="stat">RESEARCH <span id="research">0</span></div>
            <div class="stat">EMPLOYEES <span id="employees">3</span></div>
            <div id="speed-controls">
                <button class="speed-btn active" id="btn-pause">⏸</button>
                <button class="speed-btn" id="btn-1x">1x</button>
                <button class="speed-btn" id="btn-2x">2x</button>
                <button class="speed-btn" id="btn-3x">3x</button>
            </div>
            <div id="week-progress-container">
                <div id="week-progress-bar"></div>
            </div>
        </header>

        <div id="main-area">
            <aside id="left-panel">
                <div class="panel-title">Actions</div>
                <div id="actions">
                    <button class="action-btn" id="btn-new-project">🚀 New Project</button>
                    <button class="action-btn" id="btn-rest">☕ Team Break <span class="cost">-$500</span></button>
                    <button class="action-btn" id="btn-save">💾 Save Game</button>
                    <button class="action-btn" id="btn-hire">👤 Hire employee <span class="cost">-$1,500</span></button>
                    <button class="action-btn" id="btn-fix-bugs">🔧 Fix Bugs <span class="cost">-$800</span></button>
                    <button class="action-btn" id="btn-feature">⚙️ Develop Feature <span class="cost">-$1,200</span></button>
                </div>

                <div id="project-panel" class="hidden">
                    <div class="panel-title" style="margin-top: 16px;">Active Project</div>
                    <div id="project-info"></div>
                </div>

                <div class="panel-title" style="margin-top: 16px;">Log</div>
                <div id="event-box">Awaiting decisions...</div>
            </aside>

            <main id="center-panel">
                <canvas id="game-canvas"></canvas>
            </main>

            <aside id="right-panel">
                <div>
                    <div class="panel-title">Team</div>
                    <div class="stat-row">Energy <span id="energy">100</span></div>
                    <div class="stat-row">Motivation <span id="motivation">100</span></div>
                </div>
                <div>
                    <div class="panel-title">Product</div>
                    <div class="stat-row">Bugs <span id="bugs">0</span></div>
                    <div class="stat-row">Features <span id="features">0</span></div>
                    <div class="stat-row">Stability <span id="stability">100</span></div>
                </div>
            </aside>
        </div>
        <div id="event-modal" class="hidden">
            <div id="event-modal-box">
                <div id="event-modal-title"></div>
                <div id="event-modal-text"></div>
                <div id="event-modal-choices"></div>
            </div>
        </div>
        <div id="summary-modal" class="hidden">
            <div id="summary-modal-box">
                <div id="summary-modal-title"></div>
                <div id="summary-modal-body"></div>
                <button class="action-btn" id="summary-continue"></button>
            </div>
        </div>
        <div id="project-modal" class="hidden">
            <div id="project-modal-box">
                <div id="project-modal-title">🚀 New Project</div>

                <div style="margin-bottom: 12px;">
                    <label class="panel-title">Project Name</label>
                    <input id="project-name" type="text" placeholder="e.g. TaskFlow Pro" maxlength="40" />
                </div>

                <div style="margin-bottom: 16px;">
                    <label class="panel-title">Description</label>
                    <textarea id="project-desc" placeholder="What does it do?" maxlength="120" rows="2"></textarea>
                </div>

                <div style="margin-bottom: 16px;">
                    <div class="panel-title" style="margin-bottom: 8px;">Features <span style="color: var(--text-sec); font-size: 0.7rem;">(Choose up to 3)</span></div>
                    <div id="feature-list"></div>
                </div>

                <div style="display: flex; gap: 8px;">
                    <button class="action-btn" id="btn-start-project">▶ Start Project</button>
                    <button class="action-btn" id="btn-cancel-project">✕ Cancel</button>
                </div>
            </div>
        </div>
        <div id="hire-modal" class="hidden">
            <div id="hire-modal-box">
                <div id="hire-modal-title">👤 Hire employee</div>
                <div id="hire-role-select">
                    <div class="panel-title" style="margin-bottom: 8px;">Choose Role</div>
                    <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                        <button class="action-btn hire-role-btn" data-role="Dev">💻 Dev</button>
                        <button class="action-btn hire-role-btn" data-role="Designer">🎨 Designer</button>
                        <button class="action-btn hire-role-btn" data-role="Manager">📋 Manager</button>
                    </div>
                </div>
                <div id="hire-candidates" class="hidden">
                    <div class="panel-title" style="margin-bottom: 8px;">Choose Candidate</div>
                    <div id="candidate-list"></div>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 16px;">
                    <button class="action-btn" id="btn-confirm-hire" class="hidden">✔ Hire</button>
                    <button class="action-btn" id="btn-cancel-hire">✕ Cancel</button>
                </div>
            </div>
        </div>

        <script src="game.js"></script>
    </body>
</html>
